<!-- @dsCard group="Status" height=110 subtitle="Five statuses told apart by shape and word" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<div class="mn-root" style="padding:24px;display:flex;gap:10px;flex-wrap:wrap">
  <span class="mn-chip mn-chip--waiting">Waiting</span>
  <span class="mn-chip mn-chip--generating"><span class="mn-chip__icon" aria-hidden="true"></span>Generating</span>
  <span class="mn-chip mn-chip--ready">Ready</span>
  <span class="mn-chip mn-chip--approved"><svg class="mn-chip__icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg> Approved</span>
  <span class="mn-chip mn-chip--failed"><svg class="mn-chip__icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="4.6"/><path d="M6 3.6v2.8M6 8.2v.1"/></svg> Failed, no charge</span>
</div>
